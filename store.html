<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Gore</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Plyr CSS with darker theme customization -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.8/plyr.css" />
    <meta name="description" content="Social Gore is a post-metal band and music production service by Matt Bryant.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="preloader">
        <div class="loader"></div>
    </div>
    <video autoplay loop muted playsinline id="background-video">
        <source src="background_video_cropped.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>

    <div class="main-logo">
        <img src="sgtextlogo.png" alt="Social Gore Logo">
    </div>

    <header class="site-header">
        <div class="logo-container">
            <img src="sgtextlogo.png" alt="Social Gore Logo" class="logo">
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="index.html#music">Music</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#gear">Gear</a>
            <a href="store.html">Store</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    

    <div class="content">
        <section id="store" class="store-section">
            <h2>Store</h2>

            <div class="gumroad-embed-container">
                <!-- Replace the following line with your Gumroad embed code -->
                <div class="gumroad-product-embed" data-gumroad-product-id="<your-product-id>" data-gumroad-single-product="true"><a href="https://gumroad.com/l/<your-product-id>">Loading...</a></div>
                <script src="https://gumroad.com/js/gumroad.js"></script>
            </div>

        </section>
    </div>

    <footer>
        <p>Connect:</p>
        <a href="https://socialgore.bandcamp.com" target="_blank">
            <img src="bandcamp.png" alt="Bandcamp">
        </a>
        <a href="#" target="_blank">
            <img src="spotify.png" alt="Spotify">
        </a>
        
    </footer>

    <!-- Plyr Player JavaScript -->
    <script src="https://cdn.plyr.io/3.6.8/plyr.polyfilled.js"></script>
    <script>
        const player=new Plyr("#plyr-audio-player",{controls:["play","progress","current-time","mute","volume","settings"]});
    </script>

    <!-- AOS JavaScript -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500); // Match CSS transition duration
        });
    </script>

    </body>
</html>
