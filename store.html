<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Gore</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Plyr CSS with darker theme customization -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.8/plyr.css" />
    <meta name="description" content="Social Gore is a post-metal band and music production service by Matt Bryant.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="preloader">
        <div class="loader"></div>
    </div>
    <video autoplay loop muted playsinline id="background-video">
        <source src="background_video_cropped.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>

    <header>
        <img src="sgtextlogo.png" alt="Social Gore Logo" class="logo">
        <div class="sgbars-banner"></div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#music">Music</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#gear">Gear</a>
        <a href="store.html">Store</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <div class="content">
        <section id="store" class="store-section">
            <h2>Store</h2>

            <!-- Gumroad Link -->
            <div class="gumroad-link-container">
                <p>Visit our Gumroad store to purchase audio samples:</p>
                <a href="https://socialgore.gumroad.com" target="_blank" class="gumroad-button">Visit Store</a>
            </div>

        </section>
    </div>

    <footer>
        <p>Connect:</p>
        <a href="https://socialgore.bandcamp.com" target="_blank">
            <img src="bandcamp.png" alt="Bandcamp">
        </a>
        <a href="#" target="_blank">
            <img src="spotify.png" alt="Spotify">
        </a>
        
    </footer>

    <a href="#" id="back-to-top" class="back-to-top">^</a>

    <!-- Back to Top Button JavaScript -->
    <script>
        const backToTopButton=document.getElementById("back-to-top");
        backToTopButton.classList.add('visible'); // Always visible for testing
        backToTopButton.addEventListener("click",e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})});
    </script>

    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500); // Match CSS transition duration
        });
    </script>

    <!-- Gumroad Embed Script (removed) -->
    
</body>
</html>
